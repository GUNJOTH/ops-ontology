version: "0.1.0"
status: "draft"
scope: "XNY_SAAS source-scoped device semantics"
purpose: "识别和使用 XNY_SAAS 中的 KKS-like 候选编码，避免把资产业务编号、位置代码和系统名称混为一谈。"

candidate_sources:
  primary:
    fields: ["LOCATIONS.LOCATION", "LOCHIERARCHY.LOCATION", "ASSET.LOCATION"]
    evidence: ["LOCATIONS.LOCATION", "LOCHIERARCHY.LOCATION", "LOCHIERARCHY.PARENT", "ASSET.LOCATION"]
    policy: "作为 KKS 候选和功能位置标识；必须保留 source_schema、SITEID 和原始值。"
  event_evidence:
    fields: ["C_FAULT.C_FAULTKKS"]
    policy: "只作为事件中的 KKS 证据，不能单独创建或合并设备身份。"
  context_only:
    - "LOCATIONS.DESCRIPTION"
    - "LOCATIONS.C_SYSTEM"
    - "LOCATIONS.C_JZH"
    - "LOCATIONS.C_SBLX"
  not_kks_by_default:
    - "ASSET.ASSETNUM"
    - "ASSET.ASSETID"
    - "PLUSCSPOTCHECK.ASSETNUM"
    - "PLUSCSPOTCHECK.STDASSETNUM"

heuristic:
  purpose: "仅用于筛选 KKS-like 候选，不等同于正式 KKS 解码。"
  pattern: "starts with two digits, contains letters and digits, no whitespace"
  retain_original: true
  do_not_split_without_key_part_catalog: true
  do_not_translate_key_parts_by_guess: true

semantic_use:
  device_link: "ASSET.LOCATION -> LOCATIONS.LOCATION"
  hierarchy: "LOCHIERARCHY.PARENT validates location hierarchy"
  description_policy: "KKS 作为设备位置/证据字段，不直接拼入设备名称。"
  mismatch_policy: "missing or conflicting KKS context routes to needs_review"

approval_requirements:
  - "plant-specific KKS key-part catalogue or confirmed sample mapping"
  - "confirmation of the two-digit prefix and subsequent key-part boundaries"
  - "confirmation that LOCATION is KKS rather than a local location code"
