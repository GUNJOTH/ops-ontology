# Pre-commit hooks for the ops-ontology repository.
#
# The hooks intentionally use the repository's unified backend/.deps environment
# and the same commands as CI/local run_tests.ps1.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: backend/.deps/bin/ruff check backend system
        language: system
        types: [python]
        pass_filenames: false

      - id: maintainability
        name: maintainability-budget
        entry: python system/verify_maintainability.py --strict
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest
        entry: python -m pytest backend/tests system/tests -q -p no:cacheprovider
        language: system
        pass_filenames: false
        types: [python]
