[pytest]
testpaths = tests ../system/tests
# -p no:cacheprovider: 不写 .pytest_cache（其内部 mkstemp 用 0o600，受限沙箱下会被拒绝）
addopts = -ra -p no:cacheprovider
markers =
    unit: 纯函数/无 IO 的快速单测
    api: FastAPI 端点与应用壳层测试
    integration: 全 HTTP 栈集成测试（TestClient + 真实只读数据/临时写库）
    semantic: 标准语义资产一致性门禁（RDF/SHACL/SPARQL/OWL-RL）
