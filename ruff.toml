# 静态检查配置（S1 门禁）。
# 策略：先启用高价值、低噪音的规则集（pycodestyle 子集 + pyflakes + isort），
# 后续阶段（S5 质量打磨）再按需加严（如 BLE001/PLW1510/TRY004 等）。
# 用法：ruff check backend system     （0 error 为门禁）

target-version = "py312"
line-length = 120
exclude = [
    ".deps*",
    ".uv-cache",
    ".venv",
    "**/__pycache__",
    "frontend",
]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

# main.py 的桥接模式是刻意为之：
# - E402：文件中部/底部的域与 schema 导入桥（阶段性兼容层，随域迁移退役）；
# - F811：遗留 in-file schema 声明被 app.schemas.* 导入覆盖（Phase 1 兼容桥）。
[lint.per-file-ignores]
"backend/app/main.py" = ["E402", "F811"]
